server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: token-mall-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:token_mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:token_mall_dev}
    password: ${MYSQL_PASSWORD:ChangeMe_123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tokenmall_dev}
    password: ${RABBITMQ_PASSWORD:ChangeMe_123456}
    virtual-host: ${RABBITMQ_VHOST:tokenmall}
    connection-timeout: 5s
    dynamic: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

tokenmall:
  jwt:
    secret: ${JWT_SECRET:tokenmall-local-dev-secret-change-me-32-bytes}
    expires-seconds: ${JWT_EXPIRES_SECONDS:7200}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

logging:
  level:
    root: INFO
    com.tokenmall: DEBUG
    org.springframework.security: INFO
